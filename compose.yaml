services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sensors
      POSTGRES_PASSWORD: sensors_dev
      POSTGRES_DB: sensors
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensors -d sensors"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
